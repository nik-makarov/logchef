name: Custom image

on:
  push:
    branches: [builds/custom]

permissions:
  contents: read

concurrency:
  group: custom-image
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'nik-makarov/logchef'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Match the patched toolchain used by Dockerfile.custom.
          go-version: '1.27.3'
          cache: true
      - name: Format, vet and native unit tests
        run: |
          go fmt ./...
          git diff --exit-code
          go vet ./...
          go test -race -shuffle=on -count=1 -gcflags='modernc.org/...=-d=checkptr=0' -timeout 20m ./...
      - name: Check generated SQL
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  frontend:
    if: github.repository == 'nik-makarov/logchef'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test:ci
          bun run build
          bun run check:bundle

  build:
    needs: [test, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: CI image metadata
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "version=custom.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      # The docker driver uses BuildKit embedded in the Ubuntu host's Docker
      # Engine. Do not replace it with docker-container's default Alpine image.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/${{ matrix.arch }}
          push: true
          # Docker's bundled driver has no external cache/attestation exporter
          # on runners using the classic image store.
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Smoke test native image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}-${{ matrix.arch }}
        run: docker run --rm --network none --read-only "$IMAGE" --help

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --tag "$image:$tag" \
            --tag "$image:custom" \
            "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag"
          {
            echo '### Published Logchef image'
            echo "Image: \`$image:$tag\`"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo 'Use the manifest digest above for deployment; custom is a moving tag.'
          } >> "$GITHUB_STEP_SUMMARY"
